name: CI Build & Typecheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Verify Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build || npx tsc --noEmit
          npm test

      - name: Verify Frontend
        run: |
          cd frontend
          npm ci
          npm run build
